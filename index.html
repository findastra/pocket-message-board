<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LED Message Board</title>
<meta name="description" content="A full-screen scrolling LED sign for the iPad: neon green board, black letters you can read from the street.">
<meta name="theme-color" content="#39ff14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LED Message Board">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Silkscreen&display=swap">
<style>
  :root {
    /* Layout: the whole screen is one LED dot panel; tapping it goes full screen, then opens a full-screen graphite settings view. */
    --board: #39ff14;
    --ink: #000000;
    --graphite: #26272b;
    --graphite-raised: #303137;
    --graphite-high: #3b3c43;
    --line: #4b4c55;
    --text: #ededf2;
    --muted: #a7a8b3;
    --neon: #39ff14;
    --neon-glow: rgba(57, 255, 20, 0.28);
    --on-neon: #0b0c0a;
    --shadow: rgba(0, 0, 0, 0.5);
    --font-pixel: "Silkscreen", "Courier New", monospace;
    --font-ui: "Chakra Petch", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }

  html, body {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    margin: 0;
    overflow: hidden;
  }
  body {
    background: var(--board);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 16px;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }

  /* The sign */
  .stage {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    outline: none;
  }
  .stage:focus-visible { box-shadow: inset 0 0 0 4px var(--ink); }
  .stage canvas,
  .preview canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: block;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    margin: 0;
    width: max-content;
    max-width: calc(100% - 32px);
    box-sizing: border-box;
    padding: 12px 20px;
    border-radius: 999px;
    background: var(--graphite);
    color: var(--text);
    font: 600 17px/1.25 var(--font-ui);
    letter-spacing: 0.02em;
    text-align: center;
    box-shadow: 0 6px 24px var(--shadow);
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .hint.is-gone { opacity: 0; }

  /* Settings: covers the whole screen and turns with it */
  .sheet {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 10;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    background: var(--graphite);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0s linear 0.2s;
  }
  .sheet.is-open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.2s ease, visibility 0s;
  }
  .sheet-inner {
    display: grid;
    gap: 22px;
    max-width: 820px;
    margin: 0 auto;
    box-sizing: border-box;
    padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand {
    margin: 0;
    font: 400 20px/1.2 var(--font-pixel);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--neon);
  }

  .preview {
    position: relative;
    height: clamp(96px, 20vh, 180px);
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--board);
  }

  .field {
    display: grid;
    gap: 8px;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
  }
  .label {
    padding: 0;
    font: 600 13px/1.2 var(--font-ui);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .value {
    font: 600 15px/1.2 var(--font-ui);
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }
  .text-input {
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    padding: 12px 14px;
    font: 600 22px/1.3 var(--font-ui);
    color: var(--text);
    background: var(--graphite-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .text-input:focus {
    outline: none;
    border-color: var(--neon);
    box-shadow: 0 0 0 3px var(--neon-glow);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 40px;
    padding: 9px 15px;
    font: 600 16px/1 var(--font-ui);
    color: var(--text);
    background: var(--graphite-raised);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--neon); color: var(--neon); }

  .sliders {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px 28px;
  }
  input[type="range"] {
    width: 100%;
    height: 36px;
    margin: 0;
    accent-color: var(--neon);
    cursor: pointer;
  }
  .scale {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }

  .swatches {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 10px;
  }
  .swatch {
    display: grid;
    gap: 6px;
    padding: 6px;
    font: 600 14px/1.2 var(--font-ui);
    text-align: left;
    color: var(--text);
    background: var(--graphite-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
  }
  .swatch[aria-pressed="true"] { border-color: var(--neon); box-shadow: inset 0 0 0 1px var(--neon); }
  .swatch-face {
    display: block;
    height: 38px;
    overflow: hidden;
    border-radius: 7px;
    font: 400 16px/38px var(--font-pixel);
    letter-spacing: 0.06em;
    text-align: center;
  }
  .swatch-name { padding: 0 2px 2px; }

  .pickers { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .picker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: 600 16px/1 var(--font-ui);
    color: var(--text);
    cursor: pointer;
  }
  .picker input {
    width: 50px;
    height: 38px;
    padding: 0;
    background: var(--graphite-raised);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }

  .sheet-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .btn {
    min-height: 46px;
    padding: 12px 20px;
    font: 700 17px/1 var(--font-ui);
    letter-spacing: 0.02em;
    color: var(--text);
    background: var(--graphite-high);
    border: 1px solid var(--line);
    border-radius: 12px;
    cursor: pointer;
  }
  .btn-primary { color: var(--on-neon); background: var(--neon); border-color: var(--neon); }
  .btn-quiet { background: transparent; }
  .note { flex-basis: 100%; margin: 0; font-size: 15px; color: var(--muted); }
  .note:empty { display: none; }

  .sheet button:focus-visible,
  .sheet input:focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet.is-open, .hint { transition: none; }
  }
</style>
</head>
<body>

<div id="stage" class="stage" role="button" tabindex="0" aria-label="Scrolling sign. Tap to change the message.">
  <canvas id="grid" aria-hidden="true"></canvas>
  <canvas id="dots" aria-hidden="true"></canvas>
</div>

<p id="hint" class="hint">Tap the sign to change the message</p>

<div id="sheet" class="sheet" aria-hidden="true">
  <form id="controls" class="sheet-inner" aria-label="Sign settings" autocomplete="off">
    <div class="sheet-head">
      <h1 class="brand">LED Message Board</h1>
      <button type="submit" class="btn btn-primary" id="done">Show sign</button>
    </div>

    <div id="previewBox" class="preview" aria-hidden="true">
      <canvas id="previewGrid"></canvas>
      <canvas id="previewDots"></canvas>
    </div>

    <div class="field">
      <label for="msg" class="label">Message</label>
      <input id="msg" name="msg" class="text-input" type="text" maxlength="200" spellcheck="false" enterkeyhint="done" placeholder="Type what the sign should say">
      <div id="quick" class="chips" role="group" aria-label="Quick messages"></div>
    </div>

    <div class="sliders">
      <div class="field">
        <div class="label-row"><label for="speed" class="label">Speed</label><output id="speedOut" for="speed" class="value"></output></div>
        <input id="speed" name="speed" type="range" min="1" max="10" step="1">
        <div class="scale" aria-hidden="true"><span>Slow</span><span>Fast</span></div>
      </div>
      <div class="field">
        <div class="label-row"><label for="size" class="label">Letter size</label><output id="sizeOut" for="size" class="value"></output></div>
        <input id="size" name="size" type="range" min="1" max="5" step="1">
        <div class="scale" aria-hidden="true"><span>Half</span><span>Fill screen</span></div>
      </div>
    </div>

    <fieldset class="field">
      <legend class="label">Colors</legend>
      <div id="presets" class="swatches"></div>
      <div class="pickers">
        <label class="picker" for="boardColor"><input id="boardColor" name="boardColor" type="color"> Board</label>
        <label class="picker" for="inkColor"><input id="inkColor" name="inkColor" type="color"> Letters</label>
      </div>
    </fieldset>

    <div class="sheet-foot">
      <button type="button" class="btn" id="fullscreen">Full screen</button>
      <button type="button" class="btn btn-quiet" id="reset">Restore defaults</button>
      <p id="note" class="note" role="status"></p>
    </div>
  </form>
</div>

<script>
(() => {
  "use strict";

  const DEFAULTS = Object.freeze({ message: "Testing 1, 2, 3", speed: 5, size: 5, board: "#39ff14", ink: "#000000" });
  const STORE_KEY = "led-message-board:v2";

  const TEXT_ROWS = 20;         // dot rows a letter is traced into: 1 above capitals, 14 of capitals, 5 for descenders
  const CAP_ROWS = 14;          // capital letter height in dots
  const SUPERSAMPLE = 8;        // pixels per dot side when tracing a letter
  const COVERAGE = 0.4;         // share of a dot's square a letter must cover to light it
  const LETTER_GAP = 0;         // extra dark columns between letters (the font's own spacing already separates them)
  const LETTERS_PER_SECOND = [0.4, 0.55, 0.7, 0.85, 1, 1.2, 1.45, 1.75, 2.1, 2.5];
  const SIZES = [0.5, 0.625, 0.75, 0.875, 1];  // share of the screen height the lettering fills
  const MIN_LETTERS_ACROSS = 1.7;  // in portrait, shrink so at least this many letters fit across
  const LIT_SIZE = 0.92;        // lit dots are near-solid squares so the letters read dark from a distance
  const UNLIT_RADIUS = 0.4;     // dark dots are small circles
  const FONT_STACK = '"Helvetica Neue", Helvetica, Arial, sans-serif';
  const QUICK = ["Testing 1, 2, 3", "Come on in!", "Sale today", "We're open"];
  const PRESETS = [
    { name: "Neon green", board: "#39ff14", ink: "#000000" },
    { name: "Red LED", board: "#0c0c0e", ink: "#ff2b2b" },
    { name: "Amber LED", board: "#0c0c0e", ink: "#ffb000" },
    { name: "Green LED", board: "#0c0c0e", ink: "#39ff14" },
    { name: "Hot pink", board: "#0c0c0e", ink: "#ff3caa" },
    { name: "Yellow", board: "#ffe600", ink: "#000000" },
  ];

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");
  const sheet = $("sheet");
  const form = $("controls");
  const previewBox = $("previewBox");
  const msgIn = $("msg");
  const speedIn = $("speed");
  const sizeIn = $("size");
  const speedOut = $("speedOut");
  const sizeOut = $("sizeOut");
  const boardIn = $("boardColor");
  const inkIn = $("inkColor");
  const quickBox = $("quick");
  const presetBox = $("presets");
  const fsBtn = $("fullscreen");
  const resetBtn = $("reset");
  const note = $("note");
  const hint = $("hint");

  /* ---------- settings ---------- */

  const isHex = (v) => typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v);
  const inRange = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;

  function loadSettings() {
    const s = { ...DEFAULTS };
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { saved = null; }
    if (saved && typeof saved === "object") {
      if (typeof saved.message === "string") s.message = saved.message.slice(0, 200);
      if (inRange(saved.speed, 1, LETTERS_PER_SECOND.length)) s.speed = saved.speed;
      if (inRange(saved.size, 1, SIZES.length)) s.size = saved.size;
      if (isHex(saved.board)) s.board = saved.board;
      if (isHex(saved.ink)) s.ink = saved.ink;
    }
    return s;
  }

  function saveSettings() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(settings)); } catch (e) { /* storage blocked: the sign still works */ }
  }

  let settings = loadSettings();

  function mix(a, b, t) {
    const pa = parseInt(a.slice(1), 16);
    const pb = parseInt(b.slice(1), 16);
    const ch = (shift) => Math.round(((pa >> shift) & 255) * (1 - t) + ((pb >> shift) & 255) * t);
    return `rgb(${ch(16)}, ${ch(8)}, ${ch(0)})`;
  }

  /* ---------- tracing letters into dots ---------- */

  const traceCv = document.createElement("canvas");
  const traceCtx = traceCv.getContext("2d", { willReadFrequently: true });
  const glyphCache = new Map();
  let fontPx = 0;
  let baseline = 0;
  let letterCols = 12;  // width of an average letter in dot columns

  function measureFont() {
    const ref = 100;
    traceCtx.font = `bold ${ref}px ${FONT_STACK}`;
    const capUp = traceCtx.measureText("H").actualBoundingBoxAscent || ref * 0.72;
    // Size the font so capitals are exactly CAP_ROWS dots tall and sit on a dot row boundary.
    fontPx = (ref * CAP_ROWS * SUPERSAMPLE) / capUp;
    baseline = (1 + CAP_ROWS) * SUPERSAMPLE;
    letterCols = (fontPx / SUPERSAMPLE) * 0.6;
  }

  function glyph(ch) {
    const cached = glyphCache.get(ch);
    if (cached) return cached;

    const font = `bold ${fontPx}px ${FONT_STACK}`;
    traceCtx.font = font;
    const metrics = traceCtx.measureText(ch);
    const advance = metrics.width;
    const advCols = Math.max(1, Math.round(advance / SUPERSAMPLE));
    const pad = 2; // spare columns each side for letters that overhang their advance
    const wCols = advCols + pad * 2;

    // Center the letter in its columns, then nudge its left ink edge onto a dot column boundary.
    let originX = pad * SUPERSAMPLE + (advCols * SUPERSAMPLE - advance) / 2;
    const inkLeft = originX - (metrics.actualBoundingBoxLeft || 0);
    originX += Math.round(inkLeft / SUPERSAMPLE) * SUPERSAMPLE - inkLeft;

    traceCv.width = wCols * SUPERSAMPLE;
    traceCv.height = TEXT_ROWS * SUPERSAMPLE;
    traceCtx.font = font;
    traceCtx.fillStyle = "#000";
    traceCtx.textBaseline = "alphabetic";
    traceCtx.fillText(ch, originX, baseline);

    const px = traceCtx.getImageData(0, 0, traceCv.width, traceCv.height).data;
    const rowStride = traceCv.width * 4;
    const need = 255 * SUPERSAMPLE * SUPERSAMPLE * COVERAGE;
    const cells = new Uint8Array(wCols * TEXT_ROWS);
    for (let c = 0; c < wCols; c++) {
      for (let r = 0; r < TEXT_ROWS; r++) {
        let sum = 0;
        for (let y = r * SUPERSAMPLE; y < (r + 1) * SUPERSAMPLE; y++) {
          let i = y * rowStride + c * SUPERSAMPLE * 4 + 3;
          for (let x = 0; x < SUPERSAMPLE; x++, i += 4) sum += px[i];
        }
        if (sum >= need) cells[c * TEXT_ROWS + r] = 1;
      }
    }
    const g = { advCols, pad, wCols, cells };
    glyphCache.set(ch, g);
    return g;
  }

  // The message as a column-major strip of lit dots, plus the first and last rows it lights.
  function rasterize(text) {
    const chars = Array.from(text.replace(/\s+/g, " ").trim());
    const empty = { cols: 0, data: new Uint8Array(0), top: 1, bottom: CAP_ROWS };
    if (!chars.length) return empty;
    const glyphs = chars.map(glyph);
    let width = 0;
    glyphs.forEach((g, i) => { width += g.advCols + (i < glyphs.length - 1 ? LETTER_GAP : 0); });
    const cols = width + 2;
    const data = new Uint8Array(cols * TEXT_ROWS);
    let x = 1;
    for (const g of glyphs) {
      for (let c = 0; c < g.wCols; c++) {
        const dc = x - g.pad + c;
        if (dc < 0 || dc >= cols) continue;
        const src = c * TEXT_ROWS;
        const dst = dc * TEXT_ROWS;
        for (let r = 0; r < TEXT_ROWS; r++) if (g.cells[src + r]) data[dst + r] = 1;
      }
      x += g.advCols + LETTER_GAP;
    }
    let top = TEXT_ROWS, bottom = -1;
    for (let i = 0; i < data.length; i++) {
      if (!data[i]) continue;
      const r = i % TEXT_ROWS;
      if (r < top) top = r;
      if (r > bottom) bottom = r;
    }
    return bottom < 0 ? empty : { cols, data, top, bottom };
  }

  /* ---------- dot panels: the full-screen sign and the small preview in settings ---------- */

  function makeBoard(gridId, dotsId, fillsScreen) {
    const gridCv = $(gridId);
    const dotsCv = $(dotsId);
    return {
      gridCv, dotsCv, fillsScreen,
      grid: gridCv.getContext("2d"),
      dots: dotsCv.getContext("2d"),
      W: 0, H: 0, dpr: 1, pitch: 10, cols: 0, rows: 0, ox: 0, oy: 0, textTop: 0,
      drawnStep: null,
    };
  }

  const main = makeBoard("grid", "dots", true);
  const preview = makeBoard("previewGrid", "previewDots", false);

  let bits = rasterize("");
  let pos = 0;          // dot columns scrolled so far
  let started = false;
  let sheetOpen = false;

  const gapCols = () => Math.round(letterCols * 1.5);
  const cycleCols = () => bits.cols + gapCols();

  // Sizes the dots so the rows the message uses fill the chosen share of the panel's height.
  function layoutBoard(b) {
    const w = b.dotsCv.clientWidth;
    const h = b.dotsCv.clientHeight;
    if (!w || !h) { b.cols = 0; return; }
    b.W = w; b.H = h;
    b.dpr = Math.min(window.devicePixelRatio || 1, 3);

    const used = bits.bottom - bits.top + 1;
    const share = b.fillsScreen ? SIZES[settings.size - 1] : 1;
    let pitch = (h * share) / (used + 1); // +1 leaves half a dot row of board above and below
    if (b.fillsScreen) pitch = Math.min(pitch, w / (letterCols * MIN_LETTERS_ACROSS));
    b.pitch = pitch;
    b.cols = Math.max(1, Math.floor(w / pitch + 1e-6));
    b.rows = Math.max(1, Math.floor(h / pitch + 1e-6));
    b.ox = (w - b.cols * pitch) / 2;
    b.oy = (h - b.rows * pitch) / 2;
    b.textTop = Math.floor((b.rows - used) / 2) - bits.top;

    const cw = Math.round(w * b.dpr);
    const chh = Math.round(h * b.dpr);
    for (const cv of [b.gridCv, b.dotsCv]) {
      if (cv.width !== cw) cv.width = cw;
      if (cv.height !== chh) cv.height = chh;
    }
    drawGrid(b);
    b.drawnStep = null;
  }

  function layoutAll() {
    layoutBoard(main);
    layoutBoard(preview);
    if (!started && main.cols) { restartMessage(); started = true; }
    renderNow();
  }

  function drawGrid(b) {
    const g = b.grid;
    g.setTransform(b.dpr, 0, 0, b.dpr, 0, 0);
    g.fillStyle = settings.board;
    g.fillRect(0, 0, b.W, b.H);
    g.fillStyle = mix(settings.board, settings.ink, 0.1);
    g.beginPath();
    const radius = b.pitch * UNLIT_RADIUS;
    const tau = Math.PI * 2;
    for (let r = 0; r < b.rows; r++) {
      const cy = b.oy + (r + 0.5) * b.pitch;
      for (let c = 0; c < b.cols; c++) {
        const cx = b.ox + (c + 0.5) * b.pitch;
        g.moveTo(cx + radius, cy);
        g.arc(cx, cy, radius, 0, tau);
      }
    }
    g.fill();
  }

  function roundSquare(ctx, x, y, s, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + s, y, x + s, y + s, r);
    ctx.arcTo(x + s, y + s, x, y + s, r);
    ctx.arcTo(x, y + s, x, y, r);
    ctx.arcTo(x, y, x + s, y, r);
    ctx.closePath();
  }

  function render(b, step) {
    b.drawnStep = step;
    const ctx = b.dots;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, b.dotsCv.width, b.dotsCv.height);
    if (!bits.cols || !b.cols) return;

    ctx.setTransform(b.dpr, 0, 0, b.dpr, 0, 0);
    ctx.fillStyle = settings.ink;
    ctx.beginPath();
    const p = b.pitch;
    const size = p * LIT_SIZE;
    const inset = (p - size) / 2;
    const corner = size * 0.2;
    const cycle = cycleCols();
    // Copies of the message repeat every `cycle` columns; start with the first one not yet off the left edge.
    for (let k = Math.floor((step - b.cols - bits.cols) / cycle) + 1; ; k++) {
      const x0 = b.cols - step + k * cycle;
      if (x0 >= b.cols) break;
      const from = Math.max(0, -x0);
      const to = Math.min(bits.cols, b.cols - x0);
      for (let c = from; c < to; c++) {
        const base = c * TEXT_ROWS;
        const x = b.ox + (x0 + c) * p + inset;
        for (let r = bits.top; r <= bits.bottom; r++) {
          if (!bits.data[base + r]) continue;
          const row = b.textTop + r;
          if (row < 0 || row >= b.rows) continue;
          roundSquare(ctx, x, b.oy + row * p + inset, size, corner);
        }
      }
    }
    ctx.fill();
  }

  function renderNow() {
    const step = Math.floor(pos);
    render(main, step);
    if (sheetOpen) render(preview, step);
  }

  let last = performance.now();
  function tick(now) {
    // Time-based, so the speed holds on slow frames; capped so waking the iPad doesn't jump far ahead.
    const dt = Math.min(1, Math.max(0, (now - last) / 1000));
    last = now;
    pos += dt * LETTERS_PER_SECOND[settings.speed - 1] * letterCols;
    if (bits.cols) pos %= cycleCols(); // the picture repeats every cycle, so this changes nothing on screen
    const step = Math.floor(pos);
    if (step !== main.drawnStep) render(main, step);
    if (sheetOpen && step !== preview.drawnStep) render(preview, step);
    requestAnimationFrame(tick);
  }

  // Puts the first letter at the left edge of the sign.
  function restartMessage() {
    pos = Math.max(0, main.cols - 2);
    main.drawnStep = null;
    preview.drawnStep = null;
  }

  function applyMessage() {
    bits = rasterize(settings.message);
    const shown = settings.message.trim() || "nothing yet";
    stage.setAttribute("aria-label", `Scrolling sign: ${shown}. Tap to change the message.`);
    for (const b of quickBox.children) b.setAttribute("aria-pressed", String(b.dataset.msg === settings.message));
    layoutAll();
  }

  function applyColors() {
    document.documentElement.style.setProperty("--board", settings.board);
    document.documentElement.style.setProperty("--ink", settings.ink);
    for (const b of presetBox.children) {
      const on = b.dataset.board === settings.board.toLowerCase() && b.dataset.ink === settings.ink.toLowerCase();
      b.setAttribute("aria-pressed", String(on));
    }
    for (const b of [main, preview]) {
      if (b.cols) drawGrid(b);
      b.drawnStep = null;
    }
    renderNow();
  }

  /* ---------- settings view ---------- */

  QUICK.forEach((text) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = text;
    b.dataset.msg = text;
    b.addEventListener("click", () => {
      settings.message = text;
      msgIn.value = text;
      applyMessage();
      restartMessage();
      saveSettings();
    });
    quickBox.appendChild(b);
  });

  PRESETS.forEach((p) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "swatch";
    b.dataset.board = p.board.toLowerCase();
    b.dataset.ink = p.ink.toLowerCase();
    const face = document.createElement("span");
    face.className = "swatch-face";
    face.style.background = p.board;
    face.style.color = p.ink;
    face.textContent = "OPEN";
    face.setAttribute("aria-hidden", "true");
    const name = document.createElement("span");
    name.className = "swatch-name";
    name.textContent = p.name;
    b.append(face, name);
    b.addEventListener("click", () => {
      settings.board = p.board;
      settings.ink = p.ink;
      boardIn.value = p.board;
      inkIn.value = p.ink;
      applyColors();
      saveSettings();
    });
    presetBox.appendChild(b);
  });

  const sizeText = (level) => (SIZES[level - 1] === 1 ? "Fills the screen" : `${Math.round(SIZES[level - 1] * 100)}% of the screen`);

  function syncForm() {
    msgIn.value = settings.message;
    speedIn.value = settings.speed;
    sizeIn.value = settings.size;
    speedOut.value = `${settings.speed} of ${LETTERS_PER_SECOND.length}`;
    sizeOut.value = sizeText(settings.size);
    boardIn.value = settings.board;
    inkIn.value = settings.ink;
  }

  let messageAtOpen = "";

  function openSheet() {
    if (sheetOpen) return;
    sheetOpen = true;
    messageAtOpen = settings.message;
    syncForm();
    note.textContent = "";
    sheet.classList.add("is-open");
    sheet.removeAttribute("aria-hidden");
    sheet.scrollTop = 0;
    hideHint();
    layoutBoard(preview);
    renderNow();
  }

  function closeSheet() {
    if (!sheetOpen) return;
    sheetOpen = false;
    sheet.classList.remove("is-open");
    sheet.setAttribute("aria-hidden", "true");
    if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
    if (settings.message !== messageAtOpen) restartMessage();
    renderNow();
    stage.focus({ preventScroll: true });
  }

  /* ---------- full screen and keeping the screen on ---------- */

  const root = document.documentElement;
  const canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const fullscreenEl = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  const launchedFromHomeScreen = () =>
    window.navigator.standalone === true ||
    window.matchMedia("(display-mode: standalone)").matches ||
    window.matchMedia("(display-mode: fullscreen)").matches;
  // In Safari the first tap goes full screen; after that, taps open the settings.
  const tapGoesFullscreen = () => canFullscreen && !fullscreenEl() && !launchedFromHomeScreen();

  async function enterFullscreen() {
    const request = root.requestFullscreen || root.webkitRequestFullscreen;
    const result = request.call(root);
    if (result && typeof result.then === "function") await result;
  }

  async function exitFullscreen() {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    const result = exit.call(document);
    if (result && typeof result.then === "function") await result;
  }

  fsBtn.hidden = !canFullscreen;
  fsBtn.addEventListener("click", async () => {
    try {
      if (fullscreenEl()) {
        await exitFullscreen();
      } else {
        await enterFullscreen();
        closeSheet();
      }
    } catch (e) {
      note.textContent = "This browser didn't allow full screen. Add the page to your Home Screen to open it with no bars.";
    }
  });

  function onFullscreenChange() {
    fsBtn.textContent = fullscreenEl() ? "Exit full screen" : "Full screen";
    queueLayout();
    keepAwake();
  }
  document.addEventListener("fullscreenchange", onFullscreenChange);
  document.addEventListener("webkitfullscreenchange", onFullscreenChange);

  let wakeLock = null;
  async function keepAwake() {
    if (!("wakeLock" in navigator) || wakeLock || document.visibilityState !== "visible") return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } catch (e) { wakeLock = null; }
  }
  document.addEventListener("visibilitychange", keepAwake);

  /* ---------- taps and keys ---------- */

  stage.addEventListener("click", async () => {
    keepAwake();
    if (sheetOpen) { closeSheet(); return; }
    if (tapGoesFullscreen()) {
      hideHint();
      try { await enterFullscreen(); return; } catch (e) { /* not allowed here: fall through to settings */ }
    }
    openSheet();
  });
  stage.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && sheetOpen) closeSheet();
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    closeSheet();
  });

  msgIn.addEventListener("input", () => {
    settings.message = msgIn.value.slice(0, 200);
    applyMessage();
    saveSettings();
  });

  speedIn.addEventListener("input", () => {
    settings.speed = Number(speedIn.value);
    speedOut.value = `${settings.speed} of ${LETTERS_PER_SECOND.length}`;
    saveSettings();
  });

  sizeIn.addEventListener("input", () => {
    settings.size = Number(sizeIn.value);
    sizeOut.value = sizeText(settings.size);
    layoutAll();
    saveSettings();
  });

  boardIn.addEventListener("input", () => {
    if (!isHex(boardIn.value)) return;
    settings.board = boardIn.value;
    applyColors();
    saveSettings();
  });

  inkIn.addEventListener("input", () => {
    if (!isHex(inkIn.value)) return;
    settings.ink = inkIn.value;
    applyColors();
    saveSettings();
  });

  resetBtn.addEventListener("click", () => {
    settings = { ...DEFAULTS };
    syncForm();
    applyColors();
    applyMessage();
    restartMessage();
    saveSettings();
    note.textContent = "Back to the neon green board saying “Testing 1, 2, 3”.";
  });

  /* ---------- hint ---------- */

  let hintTimer = 0;
  function hideHint() {
    clearTimeout(hintTimer);
    if (hint.hidden) return;
    hint.classList.add("is-gone");
    setTimeout(() => { hint.hidden = true; }, 900);
  }

  /* ---------- start ---------- */

  let layoutQueued = false;
  function queueLayout() {
    if (layoutQueued) return;
    layoutQueued = true;
    requestAnimationFrame(() => { layoutQueued = false; layoutAll(); });
  }
  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(queueLayout);
    ro.observe(stage);
    ro.observe(previewBox);
  }
  window.addEventListener("resize", queueLayout);
  window.addEventListener("orientationchange", queueLayout);

  measureFont();
  syncForm();
  applyColors();
  applyMessage();

  if (location.hash === "#settings") {
    openSheet();
  } else {
    hint.textContent = tapGoesFullscreen()
      ? "Tap for full screen. Tap again to change the message."
      : "Tap the sign to change the message.";
    hintTimer = setTimeout(hideHint, 6000);
  }
  keepAwake();
  requestAnimationFrame((now) => { last = now; requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
